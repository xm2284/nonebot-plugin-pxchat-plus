<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="pxchat-plus hand-drawn banner">
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="p"/>
      <feColorMatrix in="p" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <style><![CDATA[
      .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0%{stroke-dashoffset:1100} 22%{stroke-dashoffset:0} 82%{stroke-dashoffset:0} 100%{stroke-dashoffset:1100} }
    ]]></style>
  </defs>

  <rect width="1200" height="340" fill="#fbf7ee"/>
  <rect width="1200" height="340" filter="url(#paper)"/>

  <!-- hand-drawn border -->
  <path d="M26 20 C 320 10, 880 28, 1174 16 C 1182 120, 1176 226, 1172 320 C 880 330, 320 312, 30 324 C 18 214, 30 112, 26 20 Z"
        fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round" filter="url(#rough)"/>

  <!-- title -->
  <text x="66" y="150" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="88" font-weight="bold" fill="#1f1f1f" filter="url(#rough2)">pxchat-plus</text>
  <path class="draw" d="M70 180 q 62 -14 124 0 t 124 0 t 124 0 t 96 0" fill="none" stroke="#e07b39" stroke-width="7" stroke-linecap="round" filter="url(#rough2)"/>

  <text x="72" y="230" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="26" fill="#3a3a3a" filter="url(#rough2)">给 pxchat 装上「真人感」的增强补丁集</text>

  <!-- hand-drawn pills: 矩形框 + 居中文字，放进同一滤镜组 -->
  <g font-family="'Comic Sans MS','Segoe Print',cursive" font-size="18" fill="#2b2b2b">
    <g filter="url(#rough2)">
      <rect x="74" y="254" width="176" height="44" rx="18" fill="#fde8cf" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="162" y="282" text-anchor="middle">14 项补丁</text>
    </g>
    <g filter="url(#rough2)">
      <rect x="274" y="254" width="176" height="44" rx="18" fill="#dceaf6" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="362" y="282" text-anchor="middle">按群人设</text>
    </g>
    <g filter="url(#rough2)">
      <rect x="474" y="254" width="196" height="44" rx="18" fill="#e5f0dd" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="572" y="282" text-anchor="middle">零 AI 味发声</text>
    </g>
  </g>

  <!-- doodles -->
  <g filter="url(#rough)" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- chat bubble -->
    <path d="M866 108 L 846 148 Q 878 140 894 108 Z" fill="#ffffff"/>
    <rect x="828" y="40" width="190" height="80" rx="20" fill="#ffffff"/>
    <circle cx="886" cy="80" r="6" fill="#2b2b2b" stroke="none"/>
    <circle cx="922" cy="80" r="6" fill="#2b2b2b" stroke="none"/>
    <circle cx="958" cy="80" r="6" fill="#2b2b2b" stroke="none"/>

    <!-- sticker face -->
    <rect x="1044" y="34" width="96" height="96" rx="10" fill="#fbd9e0"/>
    <circle cx="1076" cy="76" r="6" fill="#2b2b2b" stroke="none"/>
    <circle cx="1108" cy="76" r="6" fill="#2b2b2b" stroke="none"/>
    <path d="M1074 100 q 22 18 44 0" />

    <!-- magnifier -->
    <circle cx="884" cy="212" r="30" fill="#dceaf6"/>
    <path d="M906 234 l 30 30"/>
    <path d="M872 208 q 14 -14 26 2" />

    <!-- lightning -->
    <path d="M1086 168 l -20 44 l 20 -6 l -12 40 l 40 -52 l -20 6 z" fill="#fde08a"/>
  </g>

  <g font-family="'Comic Sans MS','Segoe Print',cursive" font-size="16" fill="#5a5a5a">
    <text x="922" y="172" text-anchor="middle">群聊</text>
    <text x="1092" y="150" text-anchor="middle">表情包</text>
    <text x="884" y="288" text-anchor="middle">联网搜索</text>
    <text x="1090" y="272" text-anchor="middle">降风控</text>
  </g>
</svg>
